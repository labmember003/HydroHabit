# Builds the Android APK and iOS IPA and attaches them to a GitHub Release.
#
# Release:      git tag v1.1.0 && git push origin v1.1.0
#               (tags with a hyphen, e.g. v1.1.0-beta1, are marked as pre-releases)
# Test build:   Actions tab → Release → "Run workflow". Builds both files and
#               uploads them as workflow artifacts without creating a release.
#
# Optional secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks/.keystore (base64 -i release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password (defaults to the keystore password if unset)
# Without them the APK is signed with a throwaway key: it installs fine, but it
# can't be installed over a build signed with a different key.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Droply
  PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.falcon.hydrohabit

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            echo "::warning title=APK signed with a temporary key::Add the ANDROID_KEYSTORE_* secrets to sign releases with your own key."
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="droply-ci"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 \
              -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=$APP_NAME CI"
          fi
          ./gradlew :composeApp:assembleRelease --stacktrace
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify signature and collect APK
        run: |
          apk=composeApp/build/outputs/apk/release/composeApp-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/$APP_NAME-$GITHUB_REF_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Unsigned build: no Apple certificate needed. Sideloading tools such as
      # AltStore or Sideloadly re-sign the IPA with the installer's Apple ID.
      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          staging="$RUNNER_TEMP/ipa"
          mkdir -p "$staging/Payload" dist
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iosApp.app" "$staging/Payload/"
          (cd "$staging" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-$GITHUB_REF_NAME.ipa" Payload)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Download

            | Platform | File | Notes |
            |---|---|---|
            | Android | `${{ env.APP_NAME }}-${{ github.ref_name }}.apk` | Install directly, or get it from [Google Play](${{ env.PLAY_STORE_URL }}). |
            | iOS | `${{ env.APP_NAME }}-${{ github.ref_name }}.ipa` | Unsigned. Sideload with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io), which sign it with your Apple ID. |

            <a href="${{ env.PLAY_STORE_URL }}"><img alt="Get it on Google Play" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" height="60"></a>
