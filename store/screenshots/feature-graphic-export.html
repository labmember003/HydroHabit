<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Droply — Feature Graphic (export)</title>
<style>
  :root{
    --water:#007AFF;
    --water-2:#0A5BD6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:500px;overflow:hidden}

  .graphic{
    width:1024px;height:500px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--water) 0%,var(--water-2) 100%);
    display:flex;align-items:center;
    font-family:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  }

  .glow{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(6px)}
  .glow.a{width:420px;height:420px;top:-180px;left:-140px}
  .glow.b{width:260px;height:260px;bottom:-150px;left:120px;background:rgba(255,255,255,.08)}

  .text{color:#fff;padding-left:80px;flex:1 1 auto;position:relative;z-index:2}
  .text .badge{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .badge .drop{width:20px;height:20px;background:#fff;border-radius:0 50% 50% 50%;transform:rotate(45deg)}
  .badge span{font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.85}
  .text h1{font-size:96px;font-weight:800;letter-spacing:-2px;line-height:1}
  .text p{margin-top:16px;font-size:32px;font-weight:500;opacity:.92;max-width:460px;line-height:1.3}

  .phone{
    position:relative;z-index:2;flex:0 0 auto;margin-right:70px;
    width:260px;transform:rotate(-6deg);
  }
  .phone .frame{
    background:#0b0b0d;border-radius:44px;padding:14px;
    box-shadow:0 40px 80px rgba(0,10,30,.45);
  }
  .phone .screen{
    width:100%;aspect-ratio:1440/3120;border-radius:32px;overflow:hidden;background:#000;
  }
  .phone .screen img{width:100%;height:100%;object-fit:cover;display:block}
  .phone .notch{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:70px;height:18px;background:#0b0b0d;border-radius:0 0 14px 14px;
  }
</style>
</head>
<body>

<section class="graphic">
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="text">
    <div class="badge"><div class="drop"></div><span>Water Tracker</span></div>
    <h1>Droply</h1>
    <p>Build a hydration habit that sticks</p>
  </div>

  <div class="phone">
    <div class="frame">
      <div class="notch"></div>
      <div class="screen">
        <img src="../../Droply-PlayStore-Assets/Screenshots/1.png" alt="">
      </div>
    </div>
  </div>
</section>

</body>
</html>
